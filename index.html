<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>pmndrs — iridescent nav</title>
    <script>
      // Stamp the theme before first paint, by the same rule as src/theme.ts: dark by default,
      // light on the cube, the stored choice if there is one, and never the OS preference.
      ;(function () {
        var cube = location.pathname.indexOf('/dev/cube') === 0
        var theme = cube ? 'light' : 'dark'
        try {
          var stored = JSON.parse(localStorage.getItem(cube ? 'theme-cube' : 'theme') || 'null')
          var t = stored && stored.state && stored.state.theme
          if (t === 'light' || t === 'dark') theme = t
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
